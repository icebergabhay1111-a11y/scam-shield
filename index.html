<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Scam Shield: checks WhatsApp forwards, SMS and live calls for digital-arrest, fake-KYC and UPI-refund scams, in English, Hindi and Tamil.">
<meta name="theme-color" content="#0E1A17">
<title>Scam Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column. A rubber-stamp style verdict sits under the input,
   red flags quote the exact lines that gave the scam away, and the 1930 helpline is always one tap away. */
:root{
  --bg:#F3F1EA; --card:#FFFFFF; --ink:#13201C; --muted:#5B6661; --line:#DAD7CC;
  --brand:#0F5C4B; --brand-ink:#FFFFFF;
  --scam:#C8261B; --scam-soft:rgba(200,38,27,.10);
  --warn:#B86A00; --warn-soft:rgba(184,106,0,.12);
  --safe:#1E7A4F; --safe-soft:rgba(30,122,79,.11);
  --mark:rgba(200,38,27,.18);
  --font:"Hind","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A17; --card:#15231F; --ink:#E8EEEA; --muted:#97A59F; --line:#26372F;
  --brand:#4FC3A1; --brand-ink:#0E1A17;
  --scam:#FF6B5E; --scam-soft:rgba(255,107,94,.14);
  --warn:#F2A93B; --warn-soft:rgba(242,169,59,.14);
  --safe:#4CCB8C; --safe-soft:rgba(76,203,140,.13);
  --mark:rgba(255,107,94,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A17; --card:#15231F; --ink:#E8EEEA; --muted:#97A59F; --line:#26372F;
  --brand:#4FC3A1; --brand-ink:#0E1A17;
  --scam:#FF6B5E; --scam-soft:rgba(255,107,94,.14);
  --warn:#F2A93B; --warn-soft:rgba(242,169,59,.14);
  --safe:#4CCB8C; --safe-soft:rgba(76,203,140,.13);
  --mark:rgba(255,107,94,.28); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
[hidden]{display:none!important}
button,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;line-height:1.45}
textarea:focus{border-color:var(--brand);outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.samples{display:flex;gap:6px;flex-wrap:wrap}
.samples button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.samples button:hover{border-color:var(--ink);color:var(--ink)}

/* verdict */
.verdict{border-radius:14px;border:2px solid var(--line);padding:16px;display:grid;gap:12px;background:var(--card)}
.verdict[data-v="scam"]{border-color:var(--scam);background:linear-gradient(var(--scam-soft),var(--scam-soft)),var(--card)}
.verdict[data-v="warn"]{border-color:var(--warn);background:linear-gradient(var(--warn-soft),var(--warn-soft)),var(--card)}
.verdict[data-v="safe"]{border-color:var(--safe);background:linear-gradient(var(--safe-soft),var(--safe-soft)),var(--card)}
.stamp{display:inline-block;align-self:start;justify-self:start;font-family:var(--mono);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;padding:4px 10px;border:2px solid currentColor;border-radius:6px;transform:rotate(-2deg)}
.verdict[data-v="scam"] .stamp{color:var(--scam)}
.verdict[data-v="warn"] .stamp{color:var(--warn)}
.verdict[data-v="safe"] .stamp{color:var(--safe)}
.verdict h2{font-size:26px;font-weight:700}
.truth{font-size:18px;font-weight:600;margin:0}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.track{height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .35s}
.verdict[data-v="scam"] .track i{background:var(--scam)}
.verdict[data-v="warn"] .track i{background:var(--warn)}
.verdict[data-v="safe"] .track i{background:var(--safe)}
.meter b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.flags{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.flags li{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.flags li b{font-size:16px}
.flags q{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.todo{margin:0;padding-left:22px;display:grid;gap:4px}
.todo li::marker{font-weight:700;color:var(--ink)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.echo{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15.5px;max-height:220px;overflow:auto;border:1px solid var(--line)}

/* report */
.report{display:grid;gap:10px}
.help{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:12px;background:var(--ink);color:var(--bg);padding:14px 16px}
.help .num{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:.06em;line-height:1}
.help a,.help button{color:var(--bg);border-color:var(--bg)}
.help .btn{background:transparent}
.links{display:grid;gap:6px}
.links a{color:var(--brand);font-weight:600;text-underline-offset:3px}

/* listen */
.mic{width:100%;min-height:96px;border-radius:16px;border:2px solid var(--brand);background:var(--card);color:var(--brand);font-weight:700;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.mic[aria-pressed="true"]{background:var(--scam);border-color:var(--scam);color:#fff}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor}
.mic[aria-pressed="true"] .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.note{font-size:14px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
footer{color:var(--muted);font-size:13.5px;text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M17 2 3 7v10c0 9 6 15.5 14 19 8-3.5 14-10 14-19V7L17 2Z" fill="var(--brand)"/><path d="m11 19 4.5 4.5L24 14" fill="none" stroke="var(--brand-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Scam Shield<small data-t="tagline"></small></h1>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
      <button data-lang="ta" aria-pressed="false" lang="ta">தமிழ்</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabMsg" aria-selected="true" aria-controls="paneMsg" data-t="tabMsg"></button>
    <button class="tab" role="tab" id="tabCall" aria-selected="false" aria-controls="paneCall" data-t="tabCall"></button>
  </div>

  <!-- Message check -->
  <section id="paneMsg" role="tabpanel" aria-labelledby="tabMsg" class="card" style="display:grid;gap:12px">
    <label class="label" for="msg" data-t="pasteLabel"></label>
    <textarea id="msg" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn primary" id="checkBtn" data-t="check"></button>
      <button class="btn" id="pasteBtn" data-t="paste"></button>
      <button class="btn" id="clearBtn" data-t="clear"></button>
    </div>
    <div>
      <div class="label" data-t="tryExample" style="margin-bottom:6px"></div>
      <div class="samples" id="samples"></div>
    </div>
  </section>

  <!-- Live call -->
  <section id="paneCall" role="tabpanel" aria-labelledby="tabCall" class="card" style="display:grid;gap:12px" hidden>
    <p class="note" data-t="callHow"></p>
    <div class="row">
      <label class="label" for="recLang" data-t="callLang"></label>
      <select id="recLang">
        <option value="hi-IN">हिन्दी / Hinglish</option>
        <option value="ta-IN">தமிழ்</option>
        <option value="en-IN">English (India)</option>
      </select>
    </div>
    <button class="mic" id="micBtn" aria-pressed="false"><span class="dot"></span><span id="micTxt"></span></button>
    <div>
      <div class="label" data-t="heard" style="margin-bottom:6px"></div>
      <div class="echo" id="live" aria-live="off"></div>
    </div>
    <p class="note" data-t="callPrivacy"></p>
  </section>

  <!-- Verdict -->
  <section id="result" aria-live="polite"></section>

  <!-- Report -->
  <section class="card report" aria-labelledby="repH">
    <h3 id="repH" data-t="reportH"></h3>
    <div class="help">
      <div><div class="label" style="color:inherit;opacity:.8" data-t="helpline"></div><div class="num">1930</div></div>
      <button class="btn" id="copy1930" data-t="copy"></button>
    </div>
    <div class="links">
      <a href="https://cybercrime.gov.in" target="_blank" rel="noopener" data-t="linkPortal"></a>
      <a href="https://sancharsaathi.gov.in/sfc/" target="_blank" rel="noopener" data-t="linkChakshu"></a>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

/* =====================================================================
   4. ENGINE
   ===================================================================== */
function analyze(text){
  const hits = [], spans = [];
  for (const s of SIGNALS) {
    s.re.lastIndex = 0;
    const ms = [...text.matchAll(s.re)];
    if (!ms.length) continue;
    hits.push({ s, quote: ms[0][0].trim(), count: new Set(ms.map(m => m[0].toLowerCase().trim())).size });
    for (const m of ms) if (m[0].trim()) {
      let end = m.index + m[0].length;
      while (end < text.length && /[\p{M}‌‍]/u.test(text[end])) end++; // never split a Hindi/Tamil letter from its vowel sign
      spans.push([m.index, end]);
    }
  }
  const has = id => hits.some(h => h.s.id === id);
  let score = hits.reduce((a, h) => a + h.s.w + Math.min(8, 4 * (h.count - 1)), 0);
  // combinations scammers use together
  if (has("authority") && (has("arrestThreat") || has("idMisuse") || has("parcel"))) score += 16;
  if (has("secrecy") && (has("moneyTransfer") || has("authority"))) score += 14;
  if ((has("kyc") || has("bill") || has("simBlock")) && (has("anyLink") || has("shortLink") || has("oddDomain"))) score += 14;
  if (has("urgency") && hits.length > 1) score += 6;
  if (has("bill") && (has("callNumber") || has("urgency"))) score += 12;
  if (has("job") && has("jobDeposit")) score += 12;
  if (has("remote") && (has("otp") || has("mistakeRefund") || has("bankName") || has("kyc") || /refund|cashback|रिफ़ंड|ரீஃபண்ட்/i.test(text))) score += 12;
  // near-certain scam asks: nobody legitimate needs these
  if (has("otp") || has("upiPin") || has("videoHold")) score = Math.max(score, 64);
  if (has("bankName") && hits.length === 1) score -= 4;
  if (has("anyLink") && hits.length === 1) score -= 5;
  score = Math.max(0, Math.min(100, score));

  const byCat = {};
  for (const h of hits) if (h.s.cat) byCat[h.s.cat] = (byCat[h.s.cat] || 0) + h.s.w;
  if (has("moneyTransfer") && (has("authority") || has("arrestThreat"))) byCat.arrest = (byCat.arrest || 0) + 20;
  if (has("remote")) byCat.remote += 10; // the app install is the attack; OTP theft follows from it
  const cat = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a])[0] || (score >= 30 ? "generic" : null);
  const level = !text.trim() ? "empty" : score >= 60 ? "scam" : score >= 30 ? "warn" : "safe";
  return { score, level, cat, hits: hits.sort((a, b) => b.s.w - a.s.w), spans };
}

   6. UI
   ===================================================================== */
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, v); } catch(e){} } };
let lang = store.get("ss-lang") || "en";
let last = null, lastSpoken = { level:"", cat:"" };
const T = k => (UI[lang] && UI[lang][k]) || UI.en[k];

function esc(s){ return s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function highlighted(text, spans){
  if (!spans.length) return esc(text);
  spans.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const s of spans) { const l = merged[merged.length - 1]; if (l && s[0] <= l[1]) l[1] = Math.max(l[1], s[1]); else merged.push(s.slice()); }
  let out = "", i = 0;
  for (const [a, b] of merged) { out += esc(text.slice(i, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; i = b; }
  return out + esc(text.slice(i));
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2400); }

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
  $("#msg").placeholder = T("placeholder");
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#micTxt").textContent = listening ? T("stopListen") : T("startListen");
  renderResult(last);
}

function renderResult(r){
  const box = $("#result");
  if (!r || r.level === "empty") {
    box.innerHTML = `<div class="verdict" data-v="empty"><span class="stamp" style="color:var(--muted)">${esc(T("vEmpty"))}</span><p class="note" style="font-size:16px">${esc(T("hEmpty"))}</p></div>`;
    return;
  }
  const c = r.cat ? CAT[r.cat][lang] : null;
  const head = r.level === "scam" ? T("vScam") : r.level === "warn" ? T("vWarn") : T("vSafe");
  let html = `<div class="verdict" data-v="${r.level}">
    <span class="stamp">${esc(head)}</span>
    ${c && r.level !== "safe" ? `<h2>${esc(c[0])}</h2><p class="truth">${esc(c[1])}</p>` : `<p class="truth">${esc(T("safeTruth"))}</p>`}
    <div class="meter"><div class="track" role="img" aria-label="${esc(T("risk"))} ${r.score}/100"><i style="width:${Math.max(3, r.score)}%"></i></div><b>${esc(T("risk"))} ${r.score}/100</b></div>`;
  const flags = r.hits.filter(h => h.s.w >= 5);
  if (flags.length) {
    html += `<div class="label">${esc(T("flagsH"))}</div><ul class="flags">` +
      flags.map(h => `<li><b>${esc(h.s.label[lang])}</b><q>${esc(h.quote.length > 90 ? h.quote.slice(0, 90) + "…" : h.quote)}</q></li>`).join("") + `</ul>`;
  }
  if (c && r.level !== "safe") html += `<div class="label">${esc(T("doH"))}</div><ol class="todo">${c[2].map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
  if (r.source) html += `<div class="echo">${highlighted(r.source, r.spans)}</div>`;
  html += `</div>`;
  box.innerHTML = html;
}

function check(text, opts){
  const r = analyze(text);
  r.source = text; last = r;
  renderResult(r);
  if (opts && opts.alert) maybeAlert(r);
  return r;
}

/* spoken + vibration alert, once per escalation */
function maybeAlert(r){
  const rank = { safe:0, warn:1, scam:2 };
  if (r.level === "empty" || r.level === "safe") return;
  if (rank[r.level] < rank[lastSpoken.level || "safe"] || (r.level === lastSpoken.level && r.cat === lastSpoken.cat)) return;
  lastSpoken = { level:r.level, cat:r.cat };
  const c = CAT[r.cat || "generic"][lang];
  if (navigator.vibrate) navigator.vibrate(r.level === "scam" ? [400, 150, 400, 150, 400] : [250]);
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(c[3]);
    u.lang = { en:"en-IN", hi:"hi-IN", ta:"ta-IN" }[lang]; u.rate = 1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace("_", "-").startsWith(u.lang.slice(0, 2)));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
}

/* --- message tab --- */
const msg = $("#msg");
let typeTimer = 0;
msg.addEventListener("input", () => { clearTimeout(typeTimer); typeTimer = setTimeout(() => check(msg.value), 350); });
$("#checkBtn").addEventListener("click", () => {
  if (!msg.value.trim()) { toast(T("emptyNeed")); msg.focus(); return; }
  lastSpoken = { level:"", cat:"" };
  check(msg.value, { alert:true });
  $("#result").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start" });
});
$("#clearBtn").addEventListener("click", () => { msg.value = ""; last = null; renderResult(null); msg.focus(); });
$("#pasteBtn").addEventListener("click", async () => {
  try { const t = await navigator.clipboard.readText(); if (t) { msg.value = t; check(t, { alert:true }); } else toast(T("pasteFail")); }
  catch(e){ toast(T("pasteFail")); msg.focus(); }
});
const sbox = $("#samples");
SAMPLES.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s.k;
  b.addEventListener("click", () => { msg.value = s.t; lastSpoken = { level:"", cat:"" }; check(s.t, { alert:false }); }); sbox.append(b); });

/* --- tabs --- */
function showTab(which){
  const call = which === "call";
  $("#tabMsg").setAttribute("aria-selected", String(!call)); $("#tabCall").setAttribute("aria-selected", String(call));
  $("#paneMsg").hidden = call; $("#paneCall").hidden = !call;
  store.set("ss-tab", which);
}
$("#tabMsg").addEventListener("click", () => showTab("msg"));
$("#tabCall").addEventListener("click", () => showTab("call"));

/* --- language --- */
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("ss-lang", lang);
  const rl = { en:"en-IN", hi:"hi-IN", ta:"ta-IN" }[lang]; $("#recLang").value = rl;
  applyLang();
}));

/* --- copy helpline --- */
$("#copy1930").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText("1930"); toast(T("copied")); } catch(e){ toast("1930"); }
});

/* --- live call listening (Web Speech API) --- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, finalText = "", wantListen = false;
function setListening(on){
  listening = on;
  $("#micBtn").setAttribute("aria-pressed", String(on));
  $("#micTxt").textContent = on ? T("stopListen") : T("startListen");
}
function startListening(){
  if (!SR) { toast(T("noSpeech")); return; }
  finalText = ""; lastSpoken = { level:"", cat:"" }; $("#live").textContent = "";
  rec = new SR();
  rec.lang = $("#recLang").value; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + " "; else interim += t;
    }
    const all = (finalText + interim).slice(-4000);
    const r = check(all, { alert:true });
    $("#live").innerHTML = highlighted(all, r.spans);
    $("#live").scrollTop = $("#live").scrollHeight;
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { wantListen = false; toast(T("micDenied")); }
  };
  rec.onend = () => { if (wantListen) { try { rec.start(); } catch(e){ setListening(false); } } else setListening(false); };
  wantListen = true;
  try { rec.start(); setListening(true); } catch(e){ wantListen = false; toast(T("noSpeech")); }
}
function stopListening(){ wantListen = false; try { rec && rec.stop(); } catch(e){} setListening(false); }
$("#micBtn").addEventListener("click", () => listening ? stopListening() : startListening());
if (!SR) { $("#micBtn").disabled = true; }

/* --- boot --- */
$("#recLang").value = { en:"en-IN", hi:"hi-IN", ta:"ta-IN" }[lang];
applyLang();
showTab(store.get("ss-tab") === "call" ? "call" : "msg");
if ("speechSynthesis" in window) speechSynthesis.getVoices();
// expose engine for tests
window.ScamShield = { analyze };
})();
</script>
